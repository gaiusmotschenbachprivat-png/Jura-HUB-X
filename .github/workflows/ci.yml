name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Systempakete für Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: cargo test -p studium-core
      - name: Backups Desktop ↔ iPad-Version kompatibel
        run: tests/backup-compat.sh
      - run: cargo build -p studium-os

  web:
    name: iPad-/Browser-Version (Chromium)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Playwright (nur für den Test)
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Ende-zu-Ende-Test im Browser
        run: npm run test:web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-e2e-bilder
          path: target/e2e-web/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: studium-os-web
          path: dist-web

  safari:
    name: iPad-/Browser-Version (Safari)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Test in Safari
        run: |
          sudo safaridriver --enable
          mkdir -p dist-web/__fixture && cp tests/e2e/fixtures/folien.pdf dist-web/__fixture/
          (cd tests/e2e && npm ci)
          npx vite preview --mode web --outDir dist-web --port 4173 --strictPort --host 127.0.0.1 &
          sleep 3
          node tests/e2e-web/safari-run.mjs

  build:
    name: Installationsdatei ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: studium-os-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
