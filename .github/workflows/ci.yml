name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Systempakete für Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: cargo test -p studium-core
      - name: Backups Desktop ↔ iPad-Version kompatibel
        run: tests/backup-compat.sh
      - run: cargo build -p studium-os

  web:
    name: iPad-/Browser-Version (Chromium)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Playwright (nur für den Test)
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Ende-zu-Ende-Test im Browser
        run: npm run test:web
      - name: KI-Assistent in der Oberfläche (Claude API nachgebildet)
        run: node tests/e2e-web/ki-e2e.mjs
      - name: Schreiben wie in Word (iPad-Größe, Touch)
        run: node tests/e2e-web/editor-e2e.mjs
      - name: Vorlesungen, Schreibarten, Sortierung, Layout
        run: node tests/e2e-web/struktur-e2e.mjs
      - name: Gutachtenstil, Suchen/Ersetzen, Druckansicht, Backup-Erinnerung
        run: node tests/e2e-web/etappe1-e2e.mjs
      - name: Zeichnen (Apple Pencil), Stundenplan, Klausurenphase
        run: node tests/e2e-web/etappe2-e2e.mjs
      - name: KI-Lernhilfen (Claude API nachgebildet)
        run: node tests/e2e-web/etappe3-e2e.mjs
      - name: Normen antippen, Zitierhilfe, Literaturverzeichnis
        run: node tests/e2e-web/zitieren-e2e.mjs
      - name: Juristisches Glossar
        run: node tests/e2e-web/glossar-e2e.mjs
      - name: Folien neben Mitschrift, Handschrift in PDFs
        run: node tests/e2e-web/folien-e2e.mjs
      - name: Lernstand, Lernmodi, Glossar aus Mitschrift, Schemata üben
        run: node tests/e2e-web/lernen-e2e.mjs
      - name: Abgleich zweier Geräte, Lesemodus, Diktat
        run: node tests/e2e-web/alltag-e2e.mjs
      - name: Zwei Mitschriften nebeneinander
        run: node tests/e2e-web/zweinotizen-e2e.mjs
      - name: Gliederung antippen, Sprung in die Mitschrift
        run: node tests/e2e-web/gliederung-e2e.mjs
      - name: Farbige Kästen im Skript
        run: node tests/e2e-web/kaesten-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-e2e-bilder
          path: target/e2e-web/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: studium-os-web
          path: dist-web

  safari:
    name: iPad-/Browser-Version (Safari)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Test in Safari
        run: |
          sudo safaridriver --enable
          mkdir -p dist-web/__fixture && cp tests/e2e/fixtures/folien.pdf dist-web/__fixture/
          (cd tests/e2e && npm ci)
          npx vite preview --mode web --outDir dist-web --port 4173 --strictPort --host 127.0.0.1 > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:4173/ >/dev/null || { echo "::error::Vorschau-Server startet nicht: $(tail -5 preview.log | tr '\n' ' ')"; exit 1; }
          node tests/e2e-web/safari-run.mjs

  build:
    name: Installationsdatei ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: studium-os-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
