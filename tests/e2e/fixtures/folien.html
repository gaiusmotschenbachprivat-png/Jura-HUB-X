<h1>BGB AT – Vorlesung 3: Anfechtung</h1>
<p>Die Anfechtung ist ein Gestaltungsrecht. Sie wirkt nach § 142 Abs. 1 BGB ex tunc.</p>
<p style="page-break-before: always"></p>
<h1>Folie 2: Inhaltsirrtum</h1>
<p>Ein Inhaltsirrtum liegt vor, wenn der Erklärende über die Bedeutung seiner Erklärung irrt (Trierer Weinversteigerung).</p>
